# Replaces the old lid-switch bindl (hyprctl keyword monitor eDP-1,disable /
# eDP-1,preferred,auto,auto). That script reset eDP-1 to Hyprland's own
# auto-placement on every lid-open, which silently clobbered any deliberate
# layout -- including DMS's own "Laptop below monitor" display profile, which
# turned out to never persist actual geometry in the first place (its saved
# profile only records which monitors are involved, not x/y). These layouts
# are explicit and declarative instead, so they survive every dock/undock and
# suspend/resume cycle without any imperative script.
#
# Monitor identities, from `hyprctl monitors`:
#   eDP-1  Sharp Corporation 0x1551                3840x2400@59.99400  (laptop panel)
#   DP-2   BNQ BenQ PD3205U E8P01840019             3840x2160@60.00000  (dock monitor;
#     matched by description, not name -- DP-2 is not guaranteed stable across
#     reconnects. hyprdynamicmonitors' own required_monitors.description match
#     is an EXACT string compare, unlike Hyprland's own `monitor=desc:` lines
#     below which do prefix matching -- so this one has to be the full string,
#     serial included, or the docked profiles never win and this silently
#     falls back to "undocked" forever while still physically docked.)

[general]
destination = "$HOME/.config/hypr/config.d/99_autogenerated-monitors.conf"

[lid_events]
[lid_events.dbus_query_object]
destination = "org.freedesktop.UPower"
path = "/org/freedesktop/UPower"
method = "org.freedesktop.DBus.Properties.Get"
expected_lid_closing_value = "true"

[[lid_events.dbus_query_object.args]]
arg = "org.freedesktop.UPower"

[[lid_events.dbus_query_object.args]]
arg = "LidIsClosed"

[[lid_events.dbus_signal_match_rules]]
interface = "org.freedesktop.DBus.Properties"
object_path = "/org/freedesktop/UPower"
member = "PropertiesChanged"

[[lid_events.dbus_signal_receive_filters]]
name = "org.freedesktop.DBus.Properties.PropertiesChanged"
body = "LidIsClosed"

# Docked, lid open: both active, laptop panel centered below the BenQ.
[profiles.docked_open]
config_file = "hyprconfigs/docked_open.conf"
config_file_type = "static"

[profiles.docked_open.conditions]
lid_state = "Opened"

[[profiles.docked_open.conditions.required_monitors]]
name = "eDP-1"

[[profiles.docked_open.conditions.required_monitors]]
description = "BNQ BenQ PD3205U E8P01840019"

# Docked, lid closed: laptop panel off, BenQ only. Hyprland migrates any
# workspace that was on eDP-1 onto the remaining monitor automatically.
[profiles.docked_closed]
config_file = "hyprconfigs/docked_closed.conf"
config_file_type = "static"

[profiles.docked_closed.conditions]
lid_state = "Closed"

[[profiles.docked_closed.conditions.required_monitors]]
name = "eDP-1"

[[profiles.docked_closed.conditions.required_monitors]]
description = "BNQ BenQ PD3205U E8P01840019"

# Undocked: just the laptop panel. Scores lower than the two docked profiles
# above (fewer required_monitors), so it only wins when the BenQ is actually
# absent.
[profiles.undocked]
config_file = "hyprconfigs/undocked.conf"
config_file_type = "static"

[[profiles.undocked.conditions.required_monitors]]
name = "eDP-1"

[fallback_profile]
config_file = "hyprconfigs/fallback.conf"
config_file_type = "static"
