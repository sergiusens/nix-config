#
#   sudo cat /etc/immich/env
#
# then store it encrypted, as binary rather than YAML since it is a key=value
# env file:
#
#   sops --input-type binary --output-type binary secrets/thufir.yaml
#
# It is expected to carry at least DB_PASSWORD, DB_USERNAME, DB_DATABASE_NAME
# and the hostnames. Note the hostnames change in this migration: orthanc used
